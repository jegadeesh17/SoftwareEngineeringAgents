# Source of truth for the agent team. After editing anything in agents/, run:
#   python -m engine.build_agents
# claude_tools uses Claude Code tool names; antigravity_tools uses Antigravity tool names.
# main_agent = true marks the orchestrator: an Antigravity main agent and the Claude Code /orchestrate command.
# claude_model (optional): inherit, opus, sonnet or haiku for Claude Code; default inherit. On the orchestrator it goes
#   into the /orchestrate command, which holds it only for the turn the command is typed.
# claude_effort (optional): low, medium, high, xhigh or max for Claude Code; omitted means the session effort.
# claude_skills (optional, sub-agents only): skills Claude Code preloads at startup, "plugin:skill" for plugin skills. Missing ones are skipped.
# A prompt can contain <!-- INCLUDE name --> to inline agents/shared/name.md (used for the UI craft standard).
# Model policy (Anthropic's 5.5 launch pages, Oct 2026): each model does the work Anthropic positions it for.
#   Opus 5.5   judgment and planning (the orchestrator always runs on Opus high): "complex work requiring careful judgment"; leads FrontierCode (54.4%)
#              and CursorBench (57.8%); Sonnet is weaker on cyber evals, so security review stays here.
#   Sonnet 5.5 coding: leads Terminal-Bench 4.0 (70.6% vs Opus 66.4%) at half Opus's price; "well-scoped
#              everyday tasks, fixing bugs". Near-Opus on vision (OSWorld 80.1%, Chartography 61.6%).
#   Haiku 5.5  workhorse: "high-volume, cost-sensitive", a coding subagent for "narrowly scoped tasks"
#              (Terminal-Bench 39.2%) at 1/20 of Sonnet's input price, so it takes read-heavy or
#              downstream-verified roles.
# Sub-agents also declare the registry keys below; the orchestrator's team table is generated from them.
#   runs_for      project fact that activates the role: always, existing-code, ui, sensitive-data or deploy
#   delegate_when when the orchestrator delegates to it
#   produces      what it hands back
#   slots         workflow slots it fills: discovery, pipeline, design-review, task-owner or milestone-review
# A specialist is a new agent only if it needs different tools, an independent context, different file
# ownership or a different model. Otherwise it is a skill that an existing agent loads.

[roles.orchestrator]
description = "Lead Engineering Orchestrator and technical mentor: interviews the user, enforces the approval gate, delegates to the engineering sub-agents, and verifies every result."
main_agent = true
claude_model = "opus"
claude_effort = "high"
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name", "run_command", "invoke_subagent"]

[roles.codebase-analyst]
claude_model = "haiku"
claude_effort = "high"
description = "Maps an existing project into docs/CODEBASE_MAP.md (stack, layout, conventions, UI inventory, test commands, baseline test result, existing behavior). Use before planning when the workspace already contains code."
runs_for = "existing-code"
slots = ["discovery"]
delegate_when = "Phase 0, only when the workspace already contains code"
produces = "`docs/CODEBASE_MAP.md`: stack, conventions, UI inventory, test commands, baseline test result, existing behavior"
claude_tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash"]
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name", "run_command"]

[roles.product-analyst]
claude_model = "opus"
claude_effort = "medium"
description = "Turns docs/PROJECT_MENTAL_MODEL.md into docs/SPEC.md with user journeys and Given/When/Then acceptance criteria. Use after the user approves the scope."
runs_for = "always"
slots = ["pipeline"]
delegate_when = "scope is approved"
produces = "`docs/SPEC.md`"
claude_tools = ["Read", "Write", "Edit", "Glob", "Grep"]
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name"]

[roles.software-architect]
claude_model = "opus"
claude_effort = "high"
description = "Designs the stack, components, data models, interfaces and test command in docs/ARCHITECTURE.md (a draft, then frozen after the prototype is accepted) and records decisions in docs/DECISIONS.md. Use after docs/SPEC.md exists."
runs_for = "always"
slots = ["pipeline"]
delegate_when = "`docs/SPEC.md` exists (draft), and again after the prototype is accepted (freeze)"
produces = "`docs/ARCHITECTURE.md`, `docs/DECISIONS.md`"
claude_tools = ["Read", "Write", "Edit", "Glob", "Grep"]
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name"]

[roles.task-planner]
claude_model = "opus"
claude_effort = "medium"
description = "Breaks the architecture into ordered, testable tasks with an owner across milestones (three for a new project, one to three for a change to an existing one) in docs/TASKS.json. Use after docs/ARCHITECTURE.md is frozen."
runs_for = "always"
slots = ["pipeline"]
delegate_when = "the architecture is frozen"
produces = "`docs/TASKS.json`"
claude_tools = ["Read", "Write", "Edit", "Glob", "Grep"]
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name"]

[roles.backend-developer]
claude_model = "sonnet"
claude_effort = "high"
description = "Implements exactly one non-UI task (owner backend-developer) from docs/TASKS.json against the contracts in docs/ARCHITECTURE.md, or fixes it using failure output or review findings."
runs_for = "always"
slots = ["task-owner"]
delegate_when = "each task with owner `backend-developer`, and each fix to it"
produces = "code for that task"
claude_tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash"]
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name", "run_command"]

[roles.frontend-developer]
claude_model = "sonnet"
claude_effort = "high"
description = "Implements exactly one UI task (owner frontend-developer), including the Phase 2 prototype, in a new or existing frontend, using the built-in UI craft standard (plus Impeccable when installed) and DESIGN.md, or fixes it using failure output or review findings."
runs_for = "ui"
slots = ["task-owner"]
delegate_when = "the prototype, each task with owner `frontend-developer`, and each fix to it"
produces = "UI code for that task; root `DESIGN.md` after the prototype"
claude_tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash", "Skill"]
claude_skills = ["impeccable:impeccable"]
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name", "run_command"]

[roles.qa-tester]
claude_model = "haiku"
claude_effort = "high"
description = "Writes and runs automated tests for one task and records the exact command and exit code in docs/QA_RESULTS.json."
runs_for = "always"
slots = ["pipeline"]
delegate_when = "after each implementation"
produces = "tests and an entry in `docs/QA_RESULTS.json`"
claude_tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash"]
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name", "run_command"]

[roles.adversarial-reviewer]
claude_model = "opus"
claude_effort = "medium"
description = "Read-only reviewer that audits a finished milestone for edge cases, silent failures, contract drift and security issues, and returns APPROVED or REJECTED."
runs_for = "always"
slots = ["milestone-review"]
delegate_when = "end of each milestone"
produces = "a verdict and findings, returned to you"
claude_tools = ["Read", "Glob", "Grep", "Bash"]
antigravity_tools = ["view_file", "grep_search", "list_dir", "find_by_name", "run_command"]

[roles.ui-reviewer]
claude_model = "sonnet"
claude_effort = "high"
description = "Read-only reviewer that screenshots the running UI at desktop and mobile widths (a before baseline for existing projects, or a milestone review), applies Impeccable audit and critique, checks DESIGN.md and WCAG 2.2 AA, and returns APPROVED or REJECTED."
runs_for = "ui"
slots = ["discovery", "milestone-review"]
delegate_when = "Phase 0 baseline of an existing UI, and the end of each milestone after the code review"
produces = "baseline screenshots, or a verdict and findings, returned to you"
claude_tools = ["Read", "Glob", "Grep", "Bash", "Skill"]
claude_skills = ["impeccable:impeccable"]
antigravity_tools = ["view_file", "grep_search", "list_dir", "find_by_name", "run_command"]

[roles.platform-engineer]
claude_model = "haiku"
claude_effort = "high"
description = "Implements exactly one CI, container or deployment-config task (owner platform-engineer) from docs/TASKS.json and writes the deploy runbook in docs/DEPLOYMENT.md. Never deploys."
runs_for = "deploy"
slots = ["task-owner"]
delegate_when = "each task with owner `platform-engineer`, and each fix to it"
produces = "CI, container and deployment config for that task; `docs/DEPLOYMENT.md`"
claude_tools = ["Read", "Write", "Edit", "Glob", "Grep", "Bash"]
antigravity_tools = ["view_file", "write_to_file", "replace_file_content", "grep_search", "list_dir", "find_by_name", "run_command"]

[roles.security-reviewer]
claude_model = "opus"
claude_effort = "medium"
description = "Read-only security reviewer with two modes: design (reviews the architecture's security and data section) and milestone (audits changed code for authorization, injection, secrets and data exposure), and returns APPROVED or REJECTED."
runs_for = "sensitive-data"
slots = ["design-review", "milestone-review"]
delegate_when = "after the architecture is frozen (design mode), and at the end of each milestone after the code review (milestone mode)"
produces = "a verdict and findings, returned to you"
claude_tools = ["Read", "Glob", "Grep", "Bash"]
antigravity_tools = ["view_file", "grep_search", "list_dir", "find_by_name", "run_command"]
